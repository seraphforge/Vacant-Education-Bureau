<div
  class="intro"
  [class.intro--started]="started()"
  [class.intro--leaving]="leaving()"
  (click)="enter()"
  role="button"
  tabindex="0"
  aria-label="點擊進入"
  (keydown.enter)="enter()"
  (keydown.space)="enter()"
>
  <h1 class="intro__title">README<span class="intro__bang">!!!</span></h1>
  @if (!started()) {
    <p class="intro__hint">點擊進入</p>
  }

  <!-- 音檔將由開發者手動放入 public/audio/readme_intro.mp3。
       由 enter() 的點擊手勢觸發播放；尚未放入檔案時 error 事件會被靜默吞掉，不影響動畫。 -->
  <audio #introAudio preload="auto" (error)="onAudioError()">
    <source src="audio/readme_intro.mp3" type="audio/mpeg" />
  </audio>
</div>
