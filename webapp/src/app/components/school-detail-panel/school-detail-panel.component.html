<p-dialog
  [header]="kindergarten()?.school_name ?? ''"
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [dismissableMask]="true"
  [style]="{ width: '92vw', maxWidth: '720px' }"
  (onHide)="onHide()"
>
  @if (kindergarten(); as kg) {
    <p-tabView>
      <p-tabPanel header="風險評估">
        <app-risk-assessment-tab [kindergartenId]="kg.id"></app-risk-assessment-tab>
      </p-tabPanel>
      <p-tabPanel header="裁罰紀錄">
        <app-punishment-record-tab [kindergartenId]="kg.id"></app-punishment-record-tab>
      </p-tabPanel>
      <p-tabPanel header="財報">
        <app-financial-report-tab [kindergartenId]="kg.id"></app-financial-report-tab>
      </p-tabPanel>
      <p-tabPanel header="輿情分析">
        <app-public-opinion-tab [kindergartenId]="kg.id"></app-public-opinion-tab>
      </p-tabPanel>
    </p-tabView>
  }
</p-dialog>
