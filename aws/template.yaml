AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Kindergarten query API (serverless).
  API Gateway HTTP API -> Lambda (Python, inside the RDS VPC) -> RDS MySQL.
  NOTE: comments in this file are kept ASCII-only because the AWS CLI on
  Windows decodes template files with the system ANSI code page.
  See aws/README.md for the Chinese explanation.

Parameters:
  ProjectName:
    Type: String
    Default: ntpc-kg
    Description: Prefix used when naming resources.

  CodeS3Bucket:
    Type: String
    Description: S3 bucket that holds the Lambda deployment zip.

  CodeS3Key:
    Type: String
    Description: S3 key of the Lambda zip. Changes on every deploy so the function updates.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the RDS instance lives.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets to attach the Lambda to (same VPC as RDS).

  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group of the RDS instance. An inbound rule for the Lambda is added to it.

  # --------------------------------------------------------------------------
  # Public opinion worker networking.
  #
  # The worker needs outbound internet (web sources + Bedrock + Comprehend),
  # which a lambda in the RDS subnets does not have. We add two new private
  # subnets routed through a NAT gateway instead of changing the existing
  # subnets, so the already working API keeps its current networking.
  # --------------------------------------------------------------------------
  NatPublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >
      An existing subnet that already routes 0.0.0.0/0 to the internet gateway.
      The NAT gateway is placed here. deploy.ps1 fills this with the first RDS
      subnet.

  WorkerSubnetACidr:
    Type: String
    Default: 172.31.96.0/20
    Description: >
      CIDR for the first worker subnet. Must be free inside the VPC.
      Verified unused on 2026-09-13 (the VPC only used 172.31.0/16/32/48/64/80.0/20).

  WorkerSubnetBCidr:
    Type: String
    Default: 172.31.112.0/20
    Description: CIDR for the second worker subnet (different AZ). Must be free.

  OpinionModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >
      Bedrock model used to summarise and attribute opinion items. Anthropic
      models need the "us." inference profile prefix; the bare model id is
      rejected for on-demand throughput.

  OpinionSearchEndpoint:
    Type: String
    Default: https://lite.duckduckgo.com/lite/
    Description: >
      Public search endpoint for the worker. robots.txt is honoured, so this
      must be a path the site allows. Anti-bot challenges are recorded as
      "blocked" and never worked around.

  OpinionGoogleNews:
    Type: String
    Default: "1"
    AllowedValues:
      - "1"
      - "0"
    Description: >
      Whether to query Google News RSS. It is the only source that finds news
      for a specific kindergarten by name, but its robots.txt disallows
      /rss/search for generic agents, so using it is a deliberate exception
      taken to prove the concept. Set to 0 to turn it off.

  OpinionRobotsExemptHosts:
    Type: String
    Default: news.google.com
    Description: >
      Comma separated hosts where the robots.txt check is skipped. Everything
      else still honours robots. Clear this to remove the exception; the rest
      of the protections (request delay, 401/403/429 and anti-bot detection)
      apply either way.

  DbHost:
    Type: String
  DbPort:
    Type: String
    Default: "3306"
  DbName:
    Type: String
    Default: readme
  DbUser:
    Type: String
  DbPassword:
    Type: String
    NoEcho: true

  # Cognito settings. Both default to "" so this stack can be deployed before
  # the auth stack exists; the JWT authorizer and the protected routes are then
  # simply skipped. deploy.ps1 fills these in automatically once the auth
  # stack is there.
  UserPoolClientId:
    Type: String
    Default: ""
    Description: Cognito app client id (JWT audience). Empty disables auth.
  UserPoolIssuer:
    Type: String
    Default: ""
    Description: Cognito issuer URL. Empty disables auth.

  # --------------------------------------------------------------------------
  # Parent report settings (see API_SPEC.md and aws/README.md).
  # --------------------------------------------------------------------------
  MailMode:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - ses
    Description: >
      dev = do not send mail, return the OTP in the API response (needed while
      SES is in sandbox). ses = really send through SES v2.

  MailFrom:
    Type: String
    Default: ""
    Description: >
      Verified SES sender address. Required when MailMode=ses.

  PublicBaseUrl:
    Type: String
    Default: ""
    Description: >
      Public site URL used to build the /report/<token> tracking link that is
      emailed to the parent, e.g. https://xxxx.cloudfront.net

  OtpPepper:
    Type: String
    Default: change-me-in-deploy-config
    NoEcho: true
    Description: >
      Secret mixed into the HMAC of the email verification code. The code
      itself is never stored, only HMAC(code, pepper).

  UploadAllowedOrigins:
    Type: String
    Default: "*"
    Description: >
      Comma separated origins allowed to upload attachments straight to S3.
      "*" is acceptable here because every upload still needs a presigned
      policy signed by the Lambda.

Conditions:
  HasAuth: !Not [!Equals [!Ref UserPoolIssuer, ""]]

Resources:
  # --------------------------------------------------------------------------
  # Networking: a dedicated SG for the Lambda, plus an inbound rule on the
  # existing RDS SG so the Lambda is allowed to reach MySQL.
  # --------------------------------------------------------------------------
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} lambda outbound"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 0.0.0.0/0
          Description: MySQL only
        # Needed to reach the SES interface VPC endpoint below. There is still
        # no route to the internet: the endpoint is a private ENI inside the VPC.
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to VPC endpoints (SES)
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-lambda-sg"

  RdsIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: !Ref DbPort
      ToPort: !Ref DbPort
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: !Sub "${ProjectName} lambda to RDS MySQL"

  # --------------------------------------------------------------------------
  # SES over PrivateLink.
  #
  # The Lambda lives in a VPC with no NAT gateway, so it has no route to the
  # public internet and cannot call the SES API directly. An interface VPC
  # endpoint puts an ENI for SES inside our subnets; with PrivateDnsEnabled the
  # normal SDK endpoint name resolves to that ENI, so boto3 needs no special
  # configuration. This is ~10x cheaper than adding a NAT gateway.
  # --------------------------------------------------------------------------
  SesEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} SES VPC endpoint"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: HTTPS from the API lambda
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-ses-endpoint-sg"

  SesVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      # "email" is the SES v2 API endpoint (email-smtp would be for SMTP).
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.email"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref SesEndpointSecurityGroup

  # --------------------------------------------------------------------------
  # Egress for the public opinion worker (NAT gateway).
  #
  # The API lambda deliberately stays in the RDS subnets with no internet
  # route. The opinion worker is different: it has to reach public web
  # sources, Bedrock and Comprehend, so it needs real outbound internet.
  #
  # Nothing here touches the existing subnets or the main route table, so the
  # working API keeps exactly the networking it has today. Instead we add two
  # brand new private subnets, give them their own route table pointing at a
  # NAT gateway, and attach only the worker to them.
  #
  # CIDRs default to two /20 blocks that were unused in the VPC. Override the
  # parameters if that ever stops being true.
  # --------------------------------------------------------------------------
  WorkerSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: !Ref WorkerSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-worker-a"

  WorkerSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: !Ref WorkerSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-worker-b"

  NatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-nat-eip"

  # Sits in one of the existing subnets, which already route 0.0.0.0/0 to the
  # internet gateway. A NAT gateway needs a public subnet; the worker subnets
  # above are the private side.
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref NatPublicSubnetId
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-nat"

  WorkerRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-worker-rt"

  WorkerDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref WorkerRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  WorkerSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WorkerSubnetA
      RouteTableId: !Ref WorkerRouteTable

  WorkerSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WorkerSubnetB
      RouteTableId: !Ref WorkerRouteTable

  # The worker needs plain HTTP/HTTPS out (web sources, Bedrock, Comprehend)
  # plus MySQL back to RDS. Kept separate from LambdaSecurityGroup so the
  # API lambda's egress rules stay as narrow as they are now.
  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} opinion worker outbound"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to public sources and AWS APIs
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP for sources that redirect via plain HTTP
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 0.0.0.0/0
          Description: MySQL back to RDS
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-worker-sg"

  RdsIngressFromWorker:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: !Ref DbPort
      ToPort: !Ref DbPort
      SourceSecurityGroupId: !Ref WorkerSecurityGroup
      Description: !Sub "${ProjectName} opinion worker to RDS MySQL"

  # --------------------------------------------------------------------------
  # Lambda over PrivateLink.
  #
  # The API lambda has to async-invoke the worker, but it has no internet
  # route, so it cannot reach the Lambda control plane. Same fix as SES
  # above: an interface endpoint puts a Lambda ENI inside our subnets.
  # --------------------------------------------------------------------------
  LambdaEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} lambda endpoint"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: HTTPS from the API lambda
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-lambda-endpoint-sg"

  LambdaVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.lambda"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref LambdaEndpointSecurityGroup

  # --------------------------------------------------------------------------
  # Attachment bucket for parent reports.
  #
  # Fully private. The browser uploads straight to S3 with a presigned POST
  # (API Gateway caps payloads at 10MB, and the spec allows 5 files x 5MB),
  # and both parents and staff read attachments through short lived presigned
  # GET links. Signing happens locally in the Lambda, so no S3 VPC endpoint
  # is required.
  # --------------------------------------------------------------------------
  AttachmentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-report-attachments-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - POST
              - GET
              - HEAD
            AllowedOrigins: !Split [",", !Ref UploadAllowedOrigins]
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          # Only cleans up failed uploads. Real attachments are evidence for a
          # case, so they are not expired automatically.
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # --------------------------------------------------------------------------
  # Lambda
  # --------------------------------------------------------------------------
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # CloudWatch Logs + permission to create ENIs inside the VPC
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: report-attachments-and-mail
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Objects only, and only inside the attachment bucket. The Lambda
              # never needs to list or reconfigure the bucket.
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ProjectName}-report-attachments-${AWS::AccountId}/*"
              # Sending only. Restricted to identities in this account, so this
              # role cannot be used to manage SES or send from other identities.
              - Effect: Allow
                Action:
                  - ses:SendEmail
                Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
        - PolicyName: opinion-analysis
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The API lambda kicks off the worker asynchronously. Scoped to
              # this one function so the role cannot invoke anything else.
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-opinion-worker"
              # Inference only: this role cannot create, tune or delete models.
              # Both the foundation model and the us.* inference profile need
              # to be listed, because Anthropic models are called through the
              # profile and it resolves to the model behind the scenes.
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
              # Sentiment only. Comprehend has no resource-level control for
              # these real-time calls, so the actions themselves are the limit.
              - Effect: Allow
                Action:
                  - comprehend:DetectSentiment
                  - comprehend:BatchDetectSentiment
                Resource: "*"

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-api"
      RetentionInDays: 7

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-api"
      Runtime: python3.12
      Handler: app.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 20
      MemorySize: 512
      Architectures:
        - x86_64
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          DB_PASSWORD: !Ref DbPassword
          # Parent report feature
          MAIL_MODE: !Ref MailMode
          MAIL_FROM: !Ref MailFrom
          PUBLIC_BASE_URL: !Ref PublicBaseUrl
          OTP_PEPPER: !Ref OtpPepper
          OTP_TTL_MINUTES: "10"
          ATTACH_BUCKET: !Ref AttachmentBucket
          # Public opinion scan. Named rather than !Ref'd to avoid a circular
          # dependency (the worker's IAM role is shared with this function).
          OPINION_WORKER_FUNCTION: !Sub "${ProjectName}-opinion-worker"

  # --------------------------------------------------------------------------
  # Public opinion worker.
  #
  # Same deployment zip and same role as the API, different handler and very
  # different networking: this one sits in the NAT subnets so it can reach
  # public web sources, Bedrock and Comprehend.
  #
  # Timeout is generous because the collectors deliberately go slow (at least
  # one second between requests, and longer when robots.txt asks for it).
  # ReservedConcurrentExecutions caps how many scans can run at once, which
  # matters when the thing on the other end is somebody else's website.
  # --------------------------------------------------------------------------
  OpinionWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-opinion-worker"
      RetentionInDays: 7

  OpinionWorkerFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - OpinionWorkerLogGroup
      - WorkerDefaultRoute
    Properties:
      FunctionName: !Sub "${ProjectName}-opinion-worker"
      Runtime: python3.12
      Handler: opinion_worker.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 600
      MemorySize: 1024
      ReservedConcurrentExecutions: 3
      Architectures:
        - x86_64
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      VpcConfig:
        SecurityGroupIds:
          - !Ref WorkerSecurityGroup
        SubnetIds:
          - !Ref WorkerSubnetA
          - !Ref WorkerSubnetB
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          DB_PASSWORD: !Ref DbPassword
          OPINION_MODEL_ID: !Ref OpinionModelId
          OPINION_SEARCH_ENDPOINT: !Ref OpinionSearchEndpoint
          OPINION_REQUEST_DELAY: "1.2"
          OPINION_SEARCH_QUERIES: "3"
          OPINION_MAX_ITEMS: "36"
          # Google News RSS is the only source that reliably finds news for a
          # specific kindergarten by name. Its robots.txt disallows /rss/search
          # for generic agents, so this is a deliberate, scoped exception taken
          # to prove the concept: kept to a couple of queries per scan, still
          # rate limited, and still stops on 401/403/429 or an anti-bot page.
          # Set OPINION_GOOGLE_NEWS to 0 to turn it off, or clear
          # OPINION_ROBOTS_EXEMPT_HOSTS to remove the exception entirely.
          OPINION_GOOGLE_NEWS: !Ref OpinionGoogleNews
          OPINION_GOOGLE_NEWS_QUERIES: "2"
          OPINION_GOOGLE_NEWS_RESULTS: "8"
          OPINION_ROBOTS_EXEMPT_HOSTS: !Ref OpinionRobotsExemptHosts

  # --------------------------------------------------------------------------
  # API Gateway HTTP API (cheaper and simpler than REST API)
  # --------------------------------------------------------------------------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-http-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "*"
        MaxAge: 300

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"

  # --------------------------------------------------------------------------
  # Routes.
  #
  # Public routes are listed explicitly instead of using a catch-all
  # "ANY /{proxy+}". That way a newly added endpoint is never public by
  # accident: it has to be added here on purpose, or live under /api/secure.
  # --------------------------------------------------------------------------
  RouteHealth:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/health"
      Target: !Sub "integrations/${ApiIntegration}"

  RouteCounties:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/counties"
      Target: !Sub "integrations/${ApiIntegration}"

  RouteAcademicYears:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/academic-years"
      Target: !Sub "integrations/${ApiIntegration}"

  RouteKindergartens:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/kindergartens"
      Target: !Sub "integrations/${ApiIntegration}"

  RoutePunishments:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/punishments"
      Target: !Sub "integrations/${ApiIntegration}"

  # Punishment records for a single kindergarten. {id} lands in rawPath and the
  # Lambda extracts it with a regex.
  RouteKindergartenPunishments:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/kindergartens/{id}/punishments"
      Target: !Sub "integrations/${ApiIntegration}"

  ApiRootRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "ANY /"
      Target: !Sub "integrations/${ApiIntegration}"

  # --------------------------------------------------------------------------
  # Parent report (public, no login).
  #
  # Listed one by one on purpose, same as the routes above: a new endpoint must
  # be made public deliberately. The verification code flow is what protects
  # these - a report only reaches the government side after the reporter proves
  # they own the email address.
  # --------------------------------------------------------------------------
  RouteReportDraftCreate:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /api/reports/drafts"
      Target: !Sub "integrations/${ApiIntegration}"

  RouteReportOtpVerify:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /api/reports/drafts/{id}/otp/verify"
      Target: !Sub "integrations/${ApiIntegration}"

  RouteReportOtpResend:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /api/reports/drafts/{id}/otp/resend"
      Target: !Sub "integrations/${ApiIntegration}"

  RouteReportAttachmentPresign:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /api/reports/drafts/{id}/attachments/presign"
      Target: !Sub "integrations/${ApiIntegration}"

  RouteReportAttachmentRegister:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /api/reports/drafts/{id}/attachments"
      Target: !Sub "integrations/${ApiIntegration}"

  # Tracking page. The token is the capability: whoever has the link can see
  # the case, which is why the response never contains the reporter's email.
  RouteReportTracking:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/reports/{token}"
      Target: !Sub "integrations/${ApiIntegration}"

  # --------------------------------------------------------------------------
  # Authentication (only created when the auth stack has been deployed).
  #
  # A JWT authorizer makes API Gateway verify the Cognito token signature and
  # expiry before the Lambda ever runs. This matters here because the Lambda
  # sits in a VPC with no internet access, so it could not download Cognito's
  # public keys to verify a token itself.
  #
  # Audience is the app client id, which means only ID tokens are accepted.
  # We need the ID token because custom:county only appears there, not in the
  # access token.
  # --------------------------------------------------------------------------
  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Condition: HasAuth
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito-jwt
      AuthorizerType: JWT
      IdentitySource:
        - "$request.header.Authorization"
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClientId
        Issuer: !Ref UserPoolIssuer

  # Everything under /api/secure/ requires a valid token.
  #
  # Methods are listed one by one instead of using "ANY" on purpose.
  # "ANY" would also match the browser's CORS preflight (OPTIONS), and a
  # preflight carries no Authorization header, so the authorizer would reject
  # it with 401 and every cross-origin call would fail. By not claiming
  # OPTIONS here, API Gateway answers the preflight itself using
  # CorsConfiguration above, without running the authorizer.
  RouteSecureGet:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasAuth
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/secure/{proxy+}"
      Target: !Sub "integrations/${ApiIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RouteSecurePost:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasAuth
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /api/secure/{proxy+}"
      Target: !Sub "integrations/${ApiIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RouteSecurePut:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasAuth
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "PUT /api/secure/{proxy+}"
      Target: !Sub "integrations/${ApiIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  # PATCH is used by the parent report status / assignee update.
  RouteSecurePatch:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasAuth
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "PATCH /api/secure/{proxy+}"
      Target: !Sub "integrations/${ApiIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RouteSecureDelete:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasAuth
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "DELETE /api/secure/{proxy+}"
      Target: !Sub "integrations/${ApiIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*"

Outputs:
  ApiUrl:
    Description: API base URL (put this in the frontend environment file)
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  HealthUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/health"
  FunctionName:
    Value: !Ref ApiFunction
  AuthEnabled:
    Description: Whether the JWT authorizer is attached to /api/secure/*
    Value: !If [HasAuth, "yes", "no"]
  AttachmentBucketName:
    Description: S3 bucket holding parent report attachments (private)
    Value: !Ref AttachmentBucket
  MailModeOut:
    Description: dev = OTP returned in the API response, ses = real email
    Value: !Ref MailMode
  OpinionWorkerFunctionName:
    Description: Lambda that runs the public opinion scan (check its log group when a scan fails)
    Value: !Ref OpinionWorkerFunction
  OpinionEgressIp:
    Description: >
      Public IP every opinion scan goes out from. Worth knowing: if a source
      starts returning "blocked", this is the address it is blocking.
    Value: !Ref NatEip
