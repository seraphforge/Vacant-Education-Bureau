AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Kindergarten query API (serverless).
  API Gateway HTTP API -> Lambda (Python, inside the RDS VPC) -> RDS MySQL.
  NOTE: comments in this file are kept ASCII-only because the AWS CLI on
  Windows decodes template files with the system ANSI code page.
  See aws/README.md for the Chinese explanation.

Parameters:
  ProjectName:
    Type: String
    Default: ntpc-kg
    Description: Prefix used when naming resources.

  CodeS3Bucket:
    Type: String
    Description: S3 bucket that holds the Lambda deployment zip.

  CodeS3Key:
    Type: String
    Description: S3 key of the Lambda zip. Changes on every deploy so the function updates.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the RDS instance lives.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets to attach the Lambda to (same VPC as RDS).

  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group of the RDS instance. An inbound rule for the Lambda is added to it.

  DbHost:
    Type: String
  DbPort:
    Type: String
    Default: "3306"
  DbName:
    Type: String
    Default: moe
  DbUser:
    Type: String
  DbPassword:
    Type: String
    NoEcho: true

Resources:
  # --------------------------------------------------------------------------
  # Networking: a dedicated SG for the Lambda, plus an inbound rule on the
  # existing RDS SG so the Lambda is allowed to reach MySQL.
  # --------------------------------------------------------------------------
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} lambda outbound"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 0.0.0.0/0
          Description: MySQL only
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-lambda-sg"

  RdsIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: !Ref DbPort
      ToPort: !Ref DbPort
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: !Sub "${ProjectName} lambda to RDS MySQL"

  # --------------------------------------------------------------------------
  # Lambda
  # --------------------------------------------------------------------------
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # CloudWatch Logs + permission to create ENIs inside the VPC
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-api"
      RetentionInDays: 7

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-api"
      Runtime: python3.12
      Handler: app.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 20
      MemorySize: 512
      Architectures:
        - x86_64
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          DB_PASSWORD: !Ref DbPassword

  # --------------------------------------------------------------------------
  # API Gateway HTTP API (cheaper and simpler than REST API)
  # --------------------------------------------------------------------------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-http-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - OPTIONS
        AllowHeaders:
          - "*"
        MaxAge: 300

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"

  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "ANY /{proxy+}"
      Target: !Sub "integrations/${ApiIntegration}"

  ApiRootRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "ANY /"
      Target: !Sub "integrations/${ApiIntegration}"

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*"

Outputs:
  ApiUrl:
    Description: API base URL (put this in the frontend environment file)
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  HealthUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/health"
  FunctionName:
    Value: !Ref ApiFunction
