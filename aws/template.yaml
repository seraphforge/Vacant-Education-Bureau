AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Kindergarten query API (serverless).
  API Gateway HTTP API -> Lambda (Python, inside the RDS VPC) -> RDS MySQL.
  NOTE: comments in this file are kept ASCII-only because the AWS CLI on
  Windows decodes template files with the system ANSI code page.
  See aws/README.md for the Chinese explanation.

Parameters:
  ProjectName:
    Type: String
    Default: ntpc-kg
    Description: Prefix used when naming resources.

  CodeS3Bucket:
    Type: String
    Description: S3 bucket that holds the Lambda deployment zip.

  CodeS3Key:
    Type: String
    Description: S3 key of the Lambda zip. Changes on every deploy so the function updates.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the RDS instance lives.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets to attach the Lambda to (same VPC as RDS).

  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group of the RDS instance. An inbound rule for the Lambda is added to it.

  DbHost:
    Type: String
  DbPort:
    Type: String
    Default: "3306"
  DbName:
    Type: String
    Default: readme
  DbUser:
    Type: String
  DbPassword:
    Type: String
    NoEcho: true

  # Cognito settings. Both default to "" so this stack can be deployed before
  # the auth stack exists; the JWT authorizer and the protected routes are then
  # simply skipped. deploy.ps1 fills these in automatically once the auth
  # stack is there.
  UserPoolClientId:
    Type: String
    Default: ""
    Description: Cognito app client id (JWT audience). Empty disables auth.
  UserPoolIssuer:
    Type: String
    Default: ""
    Description: Cognito issuer URL. Empty disables auth.

  # --------------------------------------------------------------------------
  # Parent report settings (see API_SPEC.md and aws/README.md).
  # --------------------------------------------------------------------------
  MailMode:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - ses
    Description: >
      dev = do not send mail, return the OTP in the API response (needed while
      SES is in sandbox). ses = really send through SES v2.

  MailFrom:
    Type: String
    Default: ""
    Description: >
      Verified SES sender address. Required when MailMode=ses.

  PublicBaseUrl:
    Type: String
    Default: ""
    Description: >
      Public site URL used to build the /report/<token> tracking link that is
      emailed to the parent, e.g. https://xxxx.cloudfront.net

  OtpPepper:
    Type: String
    Default: change-me-in-deploy-config
    NoEcho: true
    Description: >
      Secret mixed into the HMAC of the email verification code. The code
      itself is never stored, only HMAC(code, pepper).

  UploadAllowedOrigins:
    Type: String
    Default: "*"
    Description: >
      Comma separated origins allowed to upload attachments straight to S3.
      "*" is acceptable here because every upload still needs a presigned
      policy signed by the Lambda.

Conditions:
  HasAuth: !Not [!Equals [!Ref UserPoolIssuer, ""]]

Resources:
  # --------------------------------------------------------------------------
  # Networking: a dedicated SG for the Lambda, plus an inbound rule on the
  # existing RDS SG so the Lambda is allowed to reach MySQL.
  # --------------------------------------------------------------------------
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} lambda outbound"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 0.0.0.0/0
          Description: MySQL only
        # Needed to reach the SES interface VPC endpoint below. There is still
        # no route to the internet: the endpoint is a private ENI inside the VPC.
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to VPC endpoints (SES)
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-lambda-sg"

  RdsIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: !Ref DbPort
      ToPort: !Ref DbPort
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: !Sub "${ProjectName} lambda to RDS MySQL"

  # --------------------------------------------------------------------------
  # SES over PrivateLink.
  #
  # The Lambda lives in a VPC with no NAT gateway, so it has no route to the
  # public internet and cannot call the SES API directly. An interface VPC
  # endpoint puts an ENI for SES inside our subnets; with PrivateDnsEnabled the
  # normal SDK endpoint name resolves to that ENI, so boto3 needs no special
  # configuration. This is ~10x cheaper than adding a NAT gateway.
  # --------------------------------------------------------------------------
  SesEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} SES VPC endpoint"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: HTTPS from the API lambda
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-ses-endpoint-sg"

  SesVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      # "email" is the SES v2 API endpoint (email-smtp would be for SMTP).
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.email"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref SesEndpointSecurityGroup

  # --------------------------------------------------------------------------
  # Attachment bucket for parent reports.
  #
  # Fully private. The browser uploads straight to S3 with a presigned POST
  # (API Gateway caps payloads at 10MB, and the spec allows 5 files x 5MB),
  # and both parents and staff read attachments through short lived presigned
  # GET links. Signing happens locally in the Lambda, so no S3 VPC endpoint
  # is required.
  # --------------------------------------------------------------------------
  AttachmentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-report-attachments-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - POST
              - GET
              - HEAD
            AllowedOrigins: !Split [",", !Ref UploadAllowedOrigins]
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          # Only cleans up failed uploads. Real attachments are evidence for a
          # case, so they are not expired automatically.
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # --------------------------------------------------------------------------
  # Lambda
  # --------------------------------------------------------------------------
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # CloudWatch Logs + permission to create ENIs inside the VPC
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: report-attachments-and-mail
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Objects only, and only inside the attachment bucket. The Lambda
              # never needs to list or reconfigure the bucket.
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ProjectName}-report-attachments-${AWS::AccountId}/*"
              # Sending only. Restricted to identities in this account, so this
              # role cannot be used to manage SES or send from other identities.
              - Effect: Allow
                Action:
                  - ses:SendEmail
                Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*"

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-api"
      RetentionInDays: 7

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-api"
      Runtime: python3.12
      Handler: app.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 20
      MemorySize: 512
      Architectures:
        - x86_64
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          DB_PASSWORD: !Ref DbPassword
          # Parent report feature
          MAIL_MODE: !Ref MailMode
          MAIL_FROM: !Ref MailFrom
          PUBLIC_BASE_URL: !Ref PublicBaseUrl
          OTP_PEPPER: !Ref OtpPepper
          OTP_TTL_MINUTES: "10"
          ATTACH_BUCKET: !Ref AttachmentBucket

  # --------------------------------------------------------------------------
  # API Gateway HTTP API (cheaper and simpler than REST API)
  # --------------------------------------------------------------------------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-http-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "*"
        MaxAge: 300

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"

  # --------------------------------------------------------------------------
  # Routes.
  #
  # Public routes are listed explicitly instead of using a catch-all
  # "ANY /{proxy+}". That way a newly added endpoint is never public by
  # accident: it has to be added here on purpose, or live under /api/secure.
  # --------------------------------------------------------------------------
  RouteHealth:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/health"
      Target: !Sub "integrations/${ApiIntegration}"

  RouteCounties:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/counties"
      Target: !Sub "integrations/${ApiIntegration}"

  RouteAcademicYears:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/academic-years"
      Target: !Sub "integrations/${ApiIntegration}"

  RouteKindergartens:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/kindergartens"
      Target: !Sub "integrations/${ApiIntegration}"

  RoutePunishments:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/punishments"
      Target: !Sub "integrations/${ApiIntegration}"

  # Punishment records for a single kindergarten. {id} lands in rawPath and the
  # Lambda extracts it with a regex.
  RouteKindergartenPunishments:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/kindergartens/{id}/punishments"
      Target: !Sub "integrations/${ApiIntegration}"

  ApiRootRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "ANY /"
      Target: !Sub "integrations/${ApiIntegration}"

  # --------------------------------------------------------------------------
  # Parent report (public, no login).
  #
  # Listed one by one on purpose, same as the routes above: a new endpoint must
  # be made public deliberately. The verification code flow is what protects
  # these - a report only reaches the government side after the reporter proves
  # they own the email address.
  # --------------------------------------------------------------------------
  RouteReportDraftCreate:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /api/reports/drafts"
      Target: !Sub "integrations/${ApiIntegration}"

  RouteReportOtpVerify:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /api/reports/drafts/{id}/otp/verify"
      Target: !Sub "integrations/${ApiIntegration}"

  RouteReportOtpResend:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /api/reports/drafts/{id}/otp/resend"
      Target: !Sub "integrations/${ApiIntegration}"

  RouteReportAttachmentPresign:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /api/reports/drafts/{id}/attachments/presign"
      Target: !Sub "integrations/${ApiIntegration}"

  RouteReportAttachmentRegister:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /api/reports/drafts/{id}/attachments"
      Target: !Sub "integrations/${ApiIntegration}"

  # Tracking page. The token is the capability: whoever has the link can see
  # the case, which is why the response never contains the reporter's email.
  RouteReportTracking:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/reports/{token}"
      Target: !Sub "integrations/${ApiIntegration}"

  # --------------------------------------------------------------------------
  # Authentication (only created when the auth stack has been deployed).
  #
  # A JWT authorizer makes API Gateway verify the Cognito token signature and
  # expiry before the Lambda ever runs. This matters here because the Lambda
  # sits in a VPC with no internet access, so it could not download Cognito's
  # public keys to verify a token itself.
  #
  # Audience is the app client id, which means only ID tokens are accepted.
  # We need the ID token because custom:county only appears there, not in the
  # access token.
  # --------------------------------------------------------------------------
  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Condition: HasAuth
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito-jwt
      AuthorizerType: JWT
      IdentitySource:
        - "$request.header.Authorization"
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClientId
        Issuer: !Ref UserPoolIssuer

  # Everything under /api/secure/ requires a valid token.
  #
  # Methods are listed one by one instead of using "ANY" on purpose.
  # "ANY" would also match the browser's CORS preflight (OPTIONS), and a
  # preflight carries no Authorization header, so the authorizer would reject
  # it with 401 and every cross-origin call would fail. By not claiming
  # OPTIONS here, API Gateway answers the preflight itself using
  # CorsConfiguration above, without running the authorizer.
  RouteSecureGet:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasAuth
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/secure/{proxy+}"
      Target: !Sub "integrations/${ApiIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RouteSecurePost:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasAuth
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /api/secure/{proxy+}"
      Target: !Sub "integrations/${ApiIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RouteSecurePut:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasAuth
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "PUT /api/secure/{proxy+}"
      Target: !Sub "integrations/${ApiIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  # PATCH is used by the parent report status / assignee update.
  RouteSecurePatch:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasAuth
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "PATCH /api/secure/{proxy+}"
      Target: !Sub "integrations/${ApiIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RouteSecureDelete:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasAuth
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "DELETE /api/secure/{proxy+}"
      Target: !Sub "integrations/${ApiIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*"

Outputs:
  ApiUrl:
    Description: API base URL (put this in the frontend environment file)
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  HealthUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/health"
  FunctionName:
    Value: !Ref ApiFunction
  AuthEnabled:
    Description: Whether the JWT authorizer is attached to /api/secure/*
    Value: !If [HasAuth, "yes", "no"]
  AttachmentBucketName:
    Description: S3 bucket holding parent report attachments (private)
    Value: !Ref AttachmentBucket
  MailModeOut:
    Description: dev = OTP returned in the API response, ses = real email
    Value: !Ref MailMode
