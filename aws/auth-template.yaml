AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Cognito user pool for government staff accounts.
  Accounts are created by an administrator only (no self sign-up).
  Each user carries custom:county, which scopes the data they can see.
  NOTE: comments are ASCII-only because the AWS CLI on Windows decodes
  template files with the system ANSI code page.
  See aws/README.md for the Chinese explanation.

Parameters:
  ProjectName:
    Type: String
    Default: ntpc-kg
    Description: Prefix used when naming resources.

Resources:
  StaffUserPool:
    Type: AWS::Cognito::UserPool
    # Retain so a template mistake cannot wipe out real accounts.
    UpdateReplacePolicy: Retain
    DeletionPolicy: Delete
    Properties:
      UserPoolName: !Sub "${ProjectName}-staff"

      # Only an admin can create accounts. Self sign-up is disabled, which is
      # what we want for government staff.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true

      # Login with a plain username (not email), because staff accounts are
      # handed out manually and may not have a mailbox registered.
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

      MfaConfiguration: "OFF"

      # WARNING: custom attributes cannot be renamed or removed after the pool
      # is created, and changing this Schema replaces the whole user pool
      # (all accounts are lost). Decide the shape before going live.
      Schema:
        - Name: county
          AttributeDataType: String
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MinLength: "0"
            MaxLength: "30"
        - Name: agency
          AttributeDataType: String
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MinLength: "0"
            MaxLength: "100"

      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: []

  # App client used by the Angular SPA.
  # GenerateSecret must stay false: a browser app cannot keep a secret.
  StaffUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-webapp"
      UserPoolId: !Ref StaffUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH # used by amazon-cognito-identity-js (password never sent raw)
        - ALLOW_USER_PASSWORD_AUTH # simple fallback / CLI testing
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AccessTokenValidity: 8
      IdTokenValidity: 8
      RefreshTokenValidity: 7

  # Members of this group bypass the county filter and see the whole country
  # (for the organiser / ministry demo account).
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref StaffUserPool
      Description: Can read every county, ignoring custom:county
      Precedence: 0

Outputs:
  UserPoolId:
    Value: !Ref StaffUserPool
  UserPoolClientId:
    Description: Put this in the frontend environment file
    Value: !Ref StaffUserPoolClient
  UserPoolIssuer:
    Description: JWT issuer URL, used by the API Gateway JWT authorizer
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${StaffUserPool}"
  UserPoolArn:
    Value: !GetAtt StaffUserPool.Arn
