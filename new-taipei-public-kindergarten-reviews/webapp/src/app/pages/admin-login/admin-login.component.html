<div class="login">
  <app-header></app-header>

  <main class="login__main">
    @if (checkingSession()) {
      <div class="login__checking">
        <p-progressSpinner strokeWidth="4" [style]="{ width: '40px', height: '40px' }"></p-progressSpinner>
      </div>
    } @else {
    <div class="login__card">
      <h2 class="login__title">政府機關登入</h2>
      <p class="login__lead">請使用主管機關核發的帳號登入審查平臺。</p>

      <form #form="ngForm" (ngSubmit)="submit(form)" novalidate>
        <div class="field">
          <label for="username">帳號 <span class="req">*</span></label>
          <input
            id="username"
            type="text"
            pInputText
            name="username"
            #userCtrl="ngModel"
            [(ngModel)]="username"
            required
            autocomplete="username"
            [disabled]="submitting()"
          />
          @if (userCtrl.touched && userCtrl.invalid) {
            <small class="err-text">請輸入帳號</small>
          }
        </div>

        <div class="field">
          <label for="password">密碼 <span class="req">*</span></label>
          <p-password
            inputId="password"
            name="password"
            #pwCtrl="ngModel"
            [(ngModel)]="password"
            [feedback]="false"
            [toggleMask]="true"
            styleClass="w-full"
            [inputStyle]="{ width: '100%' }"
            required
            [disabled]="submitting()"
          ></p-password>
          @if (pwCtrl.touched && pwCtrl.invalid) {
            <small class="err-text">請輸入密碼</small>
          }
        </div>

        @if (errorMsg()) {
          <p-message severity="error" [text]="errorMsg()!" styleClass="login__err"></p-message>
        }

        <button
          type="submit"
          pButton
          class="login__submit"
          icon="pi pi-sign-in"
          label="登入"
          [loading]="submitting()"
        ></button>
      </form>
    </div>
    }
  </main>
</div>
