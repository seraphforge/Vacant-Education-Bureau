@if (showIntro()) {
  <app-intro-animation (finished)="onIntroFinished()"></app-intro-animation>
}

<div class="home">
  <app-header></app-header>

  <main class="home__main">
    <div class="home__hero">
      <h2 class="home__headline">教育機構風險評估整合平臺</h2>
      <p class="home__sub">若您發現教保機構有異常狀況，歡迎向我們回報，協助守護孩子的學習環境。</p>

      <button
        type="button"
        pButton
        class="home__cta p-button-lg p-button-rounded"
        icon="pi pi-megaphone"
        label="我要回報"
        (click)="goReport()"
      ></button>
    </div>
  </main>
</div>
