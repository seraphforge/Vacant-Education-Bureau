@if (risk(); as r) {
  <div class="risk">
    <div class="risk__summary">
      <div class="risk__score">
        <span class="risk__score-num">{{ displayTotal() }}</span>
        <span class="risk__score-cap">綜合風險分數</span>
      </div>
      <p-tag
        [value]="levelLabel()"
        [severity]="
          r.riskLevel === 'high'
            ? 'danger'
            : r.riskLevel === 'medium'
              ? 'warning'
              : r.riskLevel === 'normal'
                ? 'success'
                : 'secondary'
        "
      ></p-tag>
    </div>

    @if (r.isPlaceholder) {
      <p class="risk__note">
        <i class="pi pi-info-circle"></i>
        目前為示範分數（模型版本：{{ r.modelVersion }}），實際評分整合中。
      </p>
    }

    <div class="risk__chart">
      @if (chartData(); as data) {
        <p-chart type="radar" [data]="data" [options]="chartOptions"></p-chart>
      }
    </div>

    @if (hasMissingScore()) {
      <p class="risk__missing">部分維度尚無資料，圖上以 0 表示。</p>
    }
  </div>
} @else if (loading()) {
  <div class="risk__center">
    <p-progressSpinner strokeWidth="4" [style]="{ width: '40px', height: '40px' }"></p-progressSpinner>
  </div>
} @else {
  <p class="risk__empty">無法載入風險評估資料。</p>
}
